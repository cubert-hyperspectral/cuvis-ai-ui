name: GitHub Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  build-and-validate:
    name: Build and validate package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          uv sync --all-extras

      - name: Verify changelog entry exists
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          if ! grep -q "^## ${TAG_VERSION}" CHANGELOG.md; then
            echo "::error::No CHANGELOG.md entry found for version ${TAG_VERSION}"
            echo "Add a '## ${TAG_VERSION}' section to CHANGELOG.md before releasing."
            exit 1
          fi
          echo "Found changelog entry for ${TAG_VERSION}"

      - name: Build package
        run: |
          uv build

      - name: Validate package
        run: |
          uv run twine check dist/*

      - name: Verify version matches tag
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          PKG_VERSION=$(ls dist/*.tar.gz | sed 's/.*cuvis_ai_ui-\(.*\)\.tar\.gz/\1/')
          echo "Tag version: $TAG_VERSION"
          echo "Package version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package version ($PKG_VERSION)"
            exit 1
          fi

      - name: Generate SBOM
        run: |
          uv run cyclonedx-py -o sbom.cdx.json || true

      - name: Generate license report
        run: |
          uv run pip-licenses --format=markdown --with-authors > licenses.md || true

      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Upload reports
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            sbom.cdx.json
            licenses.md

  windows-installer:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout cuvis-ai-ui
        uses: actions/checkout@v7
        with:
          path: cuvis-ai-ui/cuvis-ai-ui
          fetch-depth: 0

      - name: Read pinned cuvis-ai-core version
        id: core-ref
        shell: pwsh
        working-directory: cuvis-ai-ui/cuvis-ai-ui
        run: |
          $ref = (Get-Content .cuvis-ai-core-version -Raw).Trim()
          "ref=$ref" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Pinned cuvis-ai-core ref: $ref"

      - name: Checkout cuvis-ai-core (sibling)
        uses: actions/checkout@v7
        with:
          repository: cubert-hyperspectral/cuvis-ai-core
          ref: ${{ steps.core-ref.outputs.ref }}
          path: cuvis-ai-core/cuvis-ai-core
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install UI deps
        working-directory: cuvis-ai-ui/cuvis-ai-ui
        run: uv sync --extra dev

      - name: Ensure Inno Setup 6 is available
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") -and `
              -not (Test-Path "C:\Program Files\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build Windows installer
        working-directory: cuvis-ai-ui/cuvis-ai-ui
        shell: cmd
        run: installer\build.bat

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: cuvis-ai-ui/cuvis-ai-ui/installer/Output/cuvis-ai-ui-setup-*.exe
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: [build-and-validate, windows-installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Download reports
        uses: actions/download-artifact@v8
        with:
          name: reports
          path: dist/

      - name: Download Windows installer
        uses: actions/download-artifact@v8
        with:
          name: windows-installer
          path: dist/

      - name: Extract release notes
        id: extract-notes
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          sed -n "/^## ${VERSION}/,/^## [0-9]/p" CHANGELOG.md | sed '1d;$d' > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "No specific release notes found for version ${VERSION}. See CHANGELOG.md for details." > release_notes.md
          fi
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/sbom.cdx.json
            dist/licenses.md
            dist/cuvis-ai-ui-setup-*.exe
          body_path: release_notes.md
          generate_release_notes: true
